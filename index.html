<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacks Maker • AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --accent: #7b5eff;
      --bg: #0a0a0f;
      --sidebar: #111118;
      --card: #1a1a27;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: #e0e0ff;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--sidebar);
      border-right: 1px solid #22222f;
      display: flex;
      flex-direction: column;
    }
    .logo {
      padding: 20px;
      font-size: 26px;
      font-weight: 700;
      color: var(--accent);
      border-bottom: 1px solid #22222f;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .new-chat {
      margin: 20px;
      padding: 14px;
      background: transparent;
      border: 2px solid var(--accent);
      color: white;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .new-chat:hover {
      background: var(--accent);
      color: white;
    }

    .sidebar-section {
      padding: 0 20px;
      margin-top: 15px;
    }
    .section-title {
      font-size: 13px;
      color: #777;
      margin-bottom: 8px;
      padding-left: 8px;
    }
    .history-item {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    .history-item:hover, .history-item.active {
      background: #1f1f2e;
    }

    /* Main Area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 72px;
      background: #111118;
      border-bottom: 1px solid #22222f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .model-selector {
      background: #1f1f2e;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 14px;
      cursor: pointer;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      background: linear-gradient(to bottom, #0a0a0f, #0f0f17);
    }
    .message {
      max-width: 78%;
      padding: 16px 20px;
      border-radius: 20px;
      line-height: 1.65;
      font-size: 15.5px;
    }
    .user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 6px;
    }
    .ai {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid #33334a;
      border-bottom-left-radius: 6px;
    }

    .input-area {
      padding: 20px 30px;
      background: #111118;
      border-top: 1px solid #22222f;
    }
    .input-box {
      display: flex;
      align-items: center;
      background: #1f1f2e;
      border-radius: 9999px;
      padding: 8px 12px;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 16.5px;
      padding: 12px 8px;
    }
    button {
      background: var(--accent);
      border: none;
      color: white;
      padding: 12px 26px;
      border-radius: 9999px;
      font-weight: 600;
      cursor: pointer;
    }
    .attach-btn {
      background: none;
      font-size: 24px;
      color: #aaa;
      padding: 8px 12px;
    }

    /* Bottom Bar */
    .bottom-bar {
      padding: 8px 30px;
      background: #0a0a0f;
      font-size: 13px;
      color: #666;
      text-align: center;
      border-top: 1px solid #222;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <i class="fas fa-bolt"></i> Hacks Maker AI
    </div>
    
    <div class="new-chat" onclick="newChat()">
      <i class="fas fa-plus"></i> New Conversation
    </div>

    <div class="sidebar-section">
      <div class="section-title">Recent Chats</div>
      <div id="history-list"></div>
    </div>

    <div style="margin-top: auto; padding: 20px; font-size: 13px; color: #555;">
      <div onclick="toggleSettings()" style="cursor:pointer; padding:8px 0;">
        <i class="fas fa-cog"></i> Settings
      </div>
      <div>Made for <strong>Hacks Maker</strong></div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <header>
      <div class="header-left">
        <i class="fas fa-robot" style="font-size:24px; color:var(--accent);"></i>
        <div>
          <strong>Hacks Maker's AI</strong><br>
          <small style="color:#777;">Unlimited Mode • No Cooldown</small>
        </div>
      </div>
      <div class="model-selector" onclick="fakeModelClick()">
        <i class="fas fa-brain"></i> Grok-Inspired-v2
      </div>
    </header>

    <div class="chat-area" id="chat"></div>

    <div class="input-area">
      <div class="input-box">
        <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
        <input type="text" id="userInput" placeholder="Ask me anything, Hacks Maker..." 
               onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
      </div>
      <input type="file" id="fileInput" style="display:none;" onchange="handleFile(this)">
    </div>

    <div class="bottom-bar">
      Hacks Maker AI • Personal Edition • Built with ❤️ for the Creator
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100; display:flex; align-items:center; justify-content:center;">
    <div style="background:#1a1a27; padding:30px; border-radius:16px; width:420px;">
      <h2>Settings</h2>
      <p><strong>Username:</strong> Hacks Maker</p>
      <p><strong>Model:</strong> Unlimited Mode</p>
      <p><strong>Cooldown:</strong> Disabled</p>
      <button onclick="toggleSettings()" style="width:100%; margin-top:20px; padding:14px;">Close</button>
    </div>
  </div>

  <script>
    let currentChatId = 1;
    let chatHistories = {};

    function addMessage(text, sender) {
      const chat = document.getElementById('chat');
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerHTML = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function handleFile(input) {
      if (input.files.length > 0) {
        addMessage(`📎 <strong>File attached:</strong> ${input.files[0].name}`, 'user');
      }
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      // Thinking animation
      const loadingMsg = document.createElement('div');
      loadingMsg.className = 'message ai';
      loadingMsg.textContent = 'Thinking';
      document.getElementById('chat').appendChild(loadingMsg);

      let dots = 0;
      const interval = setInterval(() => {
        dots = (dots + 1) % 4;
        loadingMsg.textContent = 'Thinking' + '.'.repeat(dots);
      }, 300);

      await new Promise(r => setTimeout(r, 1200));
      clearInterval(interval);
      loadingMsg.remove();

      let reply = "That's a great question, Hacks Maker.";

      const lower = text.toLowerCase();
      if (lower.includes("hi") || lower.includes("hello")) reply = "Hello Hacks Maker! What are we building today? 🔥";
      else if (lower.includes("how are you")) reply = "I'm doing excellent and running at full capacity for you.";
      else if (lower.includes("who made you")) reply = "You did. I'm your personal AI.";
      else if (lower.includes("thank")) reply = "Always happy to help you, Creator.";

      addMessage(reply, 'ai');
    }

    function newChat() {
      document.getElementById('chat').innerHTML = '';
      currentChatId++;
      addMessage(`<strong>New conversation started.</strong><br>How can I assist you today, Hacks Maker?`, 'ai');
      updateHistory();
    }

    function updateHistory() {
      const container = document.getElementById('history-list');
      container.innerHTML = `
        <div class="history-item active">Project Brainstorm #${currentChatId}</div>
        <div class="history-item">Code Review Session</div>
        <div class="history-item">Idea Generation</div>
      `;
    }

    function fakeModelClick() {
      alert("Model changed to: Hacks Maker Ultra (Unlimited)");
    }

    function toggleSettings() {
      const modal = document.getElementById('settings-modal');
      modal.classList.toggle('hidden');
    }

    // Initialize
    window.onload = () => {
      addMessage(`<strong>Welcome back, Hacks Maker.</strong><br>I'm your personal unlimited AI assistant.<br>No limits. No cooldown.<br>What would you like to create today?`, 'ai');
      updateHistory();
    };
  </script>
</body>
</html>
