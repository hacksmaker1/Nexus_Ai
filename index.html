<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacks Maker • AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --accent: #8b6eff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #000000;
      color: #e0e0ff;
      height: 100vh;
      overflow: hidden;
    }

    /* Login Screen */
    #login-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .login-box {
      background: #0f0f0f;
      padding: 45px 40px;
      border-radius: 16px;
      width: 370px;
      text-align: center;
      border: 1px solid #222;
    }
    input {
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .login-btn { background: var(--accent); }
    .login-btn:hover { background: #a68aff; transform: translateY(-2px); }

    /* Sidebar */
    .sidebar {
      width: 270px;
      background: #0a0a0a;
      border-right: 1px solid #1f1f1f;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .logo {
      font-size: 27px;
      font-weight: 700;
      color: var(--accent);
      padding-bottom: 20px;
      border-bottom: 1px solid #1f1f1f;
    }
    .new-chat {
      margin: 20px 0;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--accent);
      color: white;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .new-chat:hover {
      background: #1a1a1a;
    }

    .history-item {
      padding: 12px 16px;
      margin: 4px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .history-item:hover {
      background: #1a1a1a;
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 70px;
      background: #0a0a0a;
      border-bottom: 1px solid #1f1f1f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: #000000;
    }
    .message {
      max-width: 75%;
      padding: 15px 20px;
      border-radius: 18px;
      line-height: 1.6;
    }
    .user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
    }
    .ai {
      align-self: flex-start;
      background: #111111;
      border: 1px solid #222;
    }

    .input-area {
      padding: 20px 25px;
      background: #0a0a0a;
      border-top: 1px solid #1f1f1f;
    }
    .input-box {
      display: flex;
      align-items: center;
      background: #111111;
      border-radius: 50px;
      padding: 8px 12px;
      border: 1px solid #222;
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 16px;
      padding: 12px;
    }

    /* Settings Modal */
    #settings-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal-content {
      background: #111111;
      padding: 30px;
      border-radius: 16px;
      width: 400px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <div class="login-box">
      <h2 style="margin-bottom: 8px;">Hacks Maker AI</h2>
      <p style="color:#777; margin-bottom: 25px;">Sign in as Creator</p>
      <input type="text" id="username" value="Hacks Maker">
      <input type="password" id="password" placeholder="Password">
      <button class="login-btn" onclick="login()">Sign In</button>
    </div>
  </div>

  <!-- Main Interface -->
  <div id="main-app" class="hidden" style="display:flex; height:100vh; width:100%;">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo"><i class="fas fa-bolt"></i> Hacks Maker</div>
      <div class="new-chat" onclick="newChat()">+ New Chat</div>
      <div id="history-list"></div>
    </div>

    <!-- Chat Area -->
    <div class="main">
      <header>
        <div><strong>Hacks Maker AI</strong></div>
        <div onclick="toggleSettings()" style="cursor:pointer;"><i class="fas fa-cog"></i></div>
      </header>

      <div class="chat-area" id="chat"></div>

      <div class="input-area">
        <div class="input-box">
          <button onclick="document.getElementById('fileInput').click()" style="background:none; font-size:24px; color:#888;">📎</button>
          <input type="text" id="userInput" placeholder="Message Hacks Maker AI..." 
                 onkeypress="if(event.key === 'Enter') sendMessage()">
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal">
    <div class="modal-content">
      <h3>Settings</h3>
      <p><strong>Logged in as:</strong> Hacks Maker</p>
      <p><strong>Mode:</strong> Unlimited</p>
      <p><strong>Cooldown:</strong> Disabled</p>
      <button onclick="toggleSettings()" style="margin-top:20px; background:#333;">Close</button>
    </div>
  </div>

  <input type="file" id="fileInput" style="display:none;" onchange="handleFile(this)">

  <script>
    function login() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("main-app").classList.remove("hidden");
      startChat();
    }

    function addMessage(text, sender) {
      const chat = document.getElementById('chat');
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerHTML = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function handleFile(input) {
      if (input.files.length) addMessage(`📎 ${input.files[0].name}`, 'user');
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      const thinking = document.createElement('div');
      thinking.className = 'message ai';
      thinking.textContent = 'Thinking...';
      document.getElementById('chat').appendChild(thinking);

      await new Promise(r => setTimeout(r, 700));
      thinking.remove();

      let reply = "Understood.";

      const lower = text.toLowerCase();
      if (lower.includes("hi") || lower.includes("hello")) reply = "Hey Hacks Maker, what's up?";
      else if (lower.includes("how are you")) reply = "I'm running perfectly. Ready for your commands.";
      else if (lower.includes("who created") || lower.includes("your creator") || lower.includes("who made you")) {
        reply = "You created me. You are Hacks Maker.";
      }

      addMessage(reply, 'ai');
    }

    function newChat() {
      document.getElementById('chat').innerHTML = '';
      addMessage("New chat started.<br>How can I help you today?", 'ai');
    }

    function startChat() {
      addMessage(`Welcome back, <strong>Hacks Maker</strong>.<br>I'm your personal black-themed AI.<br>No limits. Ask me anything.`, 'ai');
    }

    function toggleSettings() {
      const modal = document.getElementById('settings-modal');
      modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
    }

    window.onload = () => {
      // Auto login for faster testing (remove if you want login every time)
      // login();
    };
  </script>
</body>
</html>
