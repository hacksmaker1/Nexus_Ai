<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacks Maker • Grok Style AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #000000;
      color: #f0f0f0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    header {
      height: 60px;
      background: #0a0a0a;
      border-bottom: 1px solid #1f1f1f;
      display: flex;
      align-items: center;
      padding: 0 20px;
      justify-content: space-between;
    }
    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #a78bfa;
    }

    /* Chat Area */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: #000000;
    }
    .message {
      max-width: 70%;
      padding: 16px 20px;
      border-radius: 20px;
      line-height: 1.6;
    }
    .user {
      align-self: flex-end;
      background: #a78bfa;
      color: black;
      border-bottom-right-radius: 4px;
    }
    .ai {
      align-self: flex-start;
      background: #1a1a1a;
      border: 1px solid #333;
      border-bottom-left-radius: 4px;
    }

    /* Input Area - Grok Style */
    .input-area {
      padding: 20px;
      background: #0a0a0a;
      border-top: 1px solid #1f1f1f;
    }
    .input-wrapper {
      max-width: 800px;
      margin: 0 auto;
      background: #111111;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border: 1px solid #333;
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 17px;
      padding: 12px 16px;
    }
    button {
      background: #a78bfa;
      color: black;
      border: none;
      padding: 10px 24px;
      border-radius: 9999px;
      font-weight: bold;
      cursor: pointer;
    }
    .attach-btn {
      background: none;
      font-size: 24px;
      color: #888;
      padding: 8px 12px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Hacks Maker AI</div>
    <div style="color:#666;">Unlimited • Sigma Mode</div>
  </header>

  <div class="chat-container" id="chat"></div>

  <div class="input-area">
    <div class="input-wrapper">
      <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
      <input type="text" id="userInput" placeholder="Ask anything..." 
             onkeypress="if(event.key === 'Enter') sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <input type="file" id="fileInput" style="display:none;" onchange="handleFile(this)">

  <script>
    function addMessage(text, sender) {
      const chat = document.getElementById('chat');
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerHTML = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function handleFile(input) {
      if (input.files.length) {
        addMessage(`📎 Attached: ${input.files[0].name}`, 'user');
      }
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      const thinking = document.createElement('div');
      thinking.className = 'message ai';
      thinking.textContent = 'Thinking...';
      document.getElementById('chat').appendChild(thinking);

      await new Promise(r => setTimeout(r, 800));
      thinking.remove();

      let reply = "Got it, Hacks Maker.";

      const lower = text.toLowerCase();
      if (lower.includes("hi") || lower.includes("hello")) reply = "What's good, Hacks Maker? 🔥";
      else if (lower.includes("who created") || lower.includes("your creator")) reply = "You did. You're Hacks Maker.";

      addMessage(reply, 'ai');
    }

    // Welcome
    window.onload = () => {
      addMessage(`<strong>Welcome to Hacks Maker AI</strong><br>I'm your personal Grok-style AI.<br>No limits. No cooldown.<br>Ask me anything.`, 'ai');
    };
  </script>
</body>
</html>
