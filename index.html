<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacks Maker • AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --accent: #6e5eff;   /* Deep purple-blue */
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #000000;
      color: #e0e0ff;
      height: 100vh;
      overflow: hidden;
    }

    /* Login */
    #login-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .login-box {
      background: #0a0a0a;
      padding: 50px 40px;
      border-radius: 16px;
      width: 380px;
      text-align: center;
      border: 1px solid #222222;
    }
    input {
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      background: #111111;
      border: 1px solid #333333;
      border-radius: 10px;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .login-btn { background: var(--accent); }
    .login-btn:hover { background: #8b7aff; }

    /* Main UI */
    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }
    .sidebar {
      width: 270px;
      background: #050505;
      border-right: 1px solid #1a1a1a;
      padding: 20px;
    }
    .logo {
      font-size: 26px;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 30px;
    }
    .new-chat {
      background: transparent;
      border: 1px solid var(--accent);
      color: white;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 68px;
      background: #0a0a0a;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: #000000;
    }
    .message {
      max-width: 75%;
      padding: 16px 20px;
      border-radius: 18px;
      line-height: 1.6;
    }
    .user { align-self: flex-end; background: var(--accent); color: white; }
    .ai { align-self: flex-start; background: #111111; border: 1px solid #222222; }

    .input-area {
      padding: 20px 25px;
      background: #0a0a0a;
      border-top: 1px solid #1a1a1a;
    }
    .input-box {
      display: flex;
      align-items: center;
      background: #111111;
      border: 1px solid #222222;
      border-radius: 50px;
      padding: 8px 15px;
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 16px;
      padding: 12px;
    }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="login-screen">
    <div class="login-box">
      <h2>Hacks Maker AI</h2>
      <p style="color:#666; margin:15px 0 25px;">Sign in as Creator</p>
      <input type="text" id="username" value="Hacks Maker">
      <input type="password" id="password" placeholder="Password">
      <button class="login-btn" onclick="login()">Sign In</button>
    </div>
  </div>

  <!-- Main App -->
  <div id="main-app" class="app hidden">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo"><i class="fas fa-bolt"></i> Hacks Maker</div>
      <div class="new-chat" onclick="newChat()">+ New Chat</div>
    </div>

    <!-- Chat -->
    <div class="main">
      <header>
        <strong>Hacks Maker AI</strong>
        <span style="color:#555;">Unlimited Mode</span>
      </header>

      <div class="chat-area" id="chat"></div>

      <div class="input-area">
        <div class="input-box">
          <button onclick="document.getElementById('fileInput').click()" style="background:none; font-size:24px; color:#777;">📎</button>
          <input type="text" id="userInput" placeholder="Type your message..." 
                 onkeypress="if(event.key === 'Enter') sendMessage()">
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" style="display:none;" onchange="handleFile(this)">

  <script>
    function login() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("main-app").classList.remove("hidden");
      startChat();
    }

    function addMessage(text, sender) {
      const chat = document.getElementById('chat');
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerHTML = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function handleFile() {
      addMessage("📎 File attached", "user");
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      const thinking = document.createElement('div');
      thinking.className = 'message ai';
      thinking.textContent = 'Thinking...';
      document.getElementById('chat').appendChild(thinking);

      await new Promise(r => setTimeout(r, 700));
      thinking.remove();

      let reply = "Got it.";

      const lower = text.toLowerCase();
      if (lower.includes("hi") || lower.includes("hello")) reply = "Hey Hacks Maker!";
      else if (lower.includes("who created") || lower.includes("your creator")) reply = "You created me. You're Hacks Maker.";

      addMessage(reply, 'ai');
    }

    function newChat() {
      document.getElementById('chat').innerHTML = '';
      addMessage("New chat started.<br>What can I do for you?", 'ai');
    }

    function startChat() {
      addMessage(`Welcome back, <strong>Hacks Maker</strong>.<br>I'm your personal AI.<br>No limits.`, 'ai');
    }

    // For testing - auto login
    window.onload = () => {
      login();
    };
  </script>
</body>
</html>
