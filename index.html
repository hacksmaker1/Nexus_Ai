<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0ff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1a1a2e;
      padding: 15px 20px;
      text-align: center;
      border-bottom: 1px solid #4a4a6a;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
    }
    .user {
      align-self: flex-end;
      background: #6b5eff;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .ai {
      align-self: flex-start;
      background: #2a2a4a;
      border-bottom-left-radius: 4px;
    }
    .input-area {
      background: #1a1a2e;
      padding: 15px 20px;
      border-top: 1px solid #4a4a6a;
    }
    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #2a2a4a;
      border-radius: 25px;
      padding: 8px 12px;
    }
    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 16px;
    }
    button {
      background: #6b5eff;
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
    }
    .attach-btn {
      background: none;
      color: #a0a0ff;
      font-size: 22px;
      padding: 8px;
    }
    .file-list {
      margin-top: 8px;
      font-size: 14px;
      color: #88aaff;
    }
  </style>
</head>
<body>

  <header>
    <h2>🤖 My Personal AI</h2>
    <p>No cooldown • Unlimited chat</p>
  </header>

  <div class="chat-container" id="chat"></div>

  <div class="input-area">
    <div class="file-list" id="fileList"></div>
    <div class="input-wrapper">
      <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
      <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
    <input type="file" id="fileInput" multiple style="display: none;" onchange="handleFiles(this)">
  </div>

  <script>
    let attachedFiles = [];

    function addMessage(text, sender) {
      const chat = document.getElementById('chat');
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerHTML = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function handleFiles(input) {
      attachedFiles = Array.from(input.files);
      const fileList = document.getElementById('fileList');
      fileList.innerHTML = attachedFiles.length ? 
        '📁 Attached: ' + attachedFiles.map(f => f.name).join(', ') : '';
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const message = input.value.trim();
      
      if (!message && attachedFiles.length === 0) return;

      // Add user message
      if (message) {
        addMessage(message, 'user');
      } else {
        addMessage('📎 Sent files: ' + attachedFiles.map(f => f.name).join(', '), 'user');
      }

      // Clear input
      input.value = '';

      // Simulate thinking
      const thinking = document.createElement('div');
      thinking.className = 'message ai';
      thinking.textContent = 'Thinking...';
      document.getElementById('chat').appendChild(thinking);

      // Fake AI response delay
      await new Promise(r => setTimeout(r, 800));

      thinking.remove();

      // AI Response
      let reply = "That's interesting! Tell me more.";

      if (message.toLowerCase().includes("hello") || message.toLowerCase().includes("hi")) {
        reply = "Hello! How can I help you today?";
      } else if (message.toLowerCase().includes("how are you")) {
        reply = "I'm doing great, thanks for asking! Ready for anything.";
      } else if (attachedFiles.length > 0) {
        reply = `I received your files. I can analyze them if you want. What would you like me to do with them?`;
      }

      addMessage(reply, 'ai');

      // Clear files after sending
      attachedFiles = [];
      document.getElementById('fileList').innerHTML = '';
    }

    // Welcome message
    window.onload = () => {
      addMessage("Hi! I'm your personal AI assistant.<br>No limits, no cooldown.<br>How can I help you today?", 'ai');
    };
  </script>

</body>
</html>
