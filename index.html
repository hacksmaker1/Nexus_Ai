<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacks Maker • AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --accent: #7b5eff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0a0a14 0%, #1a0033 100%);
      color: #e0e0ff;
      height: 100vh;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    /* Login Screen */
    #login-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 10, 20, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.6s ease;
    }
    .login-box {
      background: rgba(26, 26, 42, 0.95);
      padding: 50px 40px;
      border-radius: 20px;
      width: 380px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(123, 94, 255, 0.25);
      transition: transform 0.4s ease;
    }
    .login-box:hover {
      transform: translateY(-5px);
    }
    input {
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      background: #2a2a4a;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    input:focus {
      outline: none;
      background: #33335a;
      box-shadow: 0 0 0 3px rgba(123, 94, 255, 0.3);
    }
    button {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .login-btn { background: var(--accent); }
    .login-btn:hover { background: #9b7fff; transform: scale(1.03); }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: rgba(17, 17, 24, 0.95);
      border-right: 1px solid #33334a;
      padding: 20px;
      display: flex;
      flex-direction: column;
      transition: all 0.4s ease;
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      padding: 10px 0;
      margin-bottom: 25px;
    }
    .new-chat {
      padding: 16px;
      background: transparent;
      border: 2px solid var(--accent);
      color: white;
      border-radius: 14px;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .new-chat:hover {
      background: var(--accent);
      transform: translateY(-3px);
    }

    .history-item {
      padding: 14px 18px;
      margin: 6px 0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .history-item:hover {
      background: #2a2a4a;
      transform: translateX(6px);
    }

    /* Main Area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 75px;
      background: rgba(17, 17, 24, 0.9);
      border-bottom: 1px solid #33334a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      background: transparent;
    }
    .message {
      max-width: 78%;
      padding: 17px 22px;
      border-radius: 22px;
      line-height: 1.65;
      font-size: 15.8px;
      transition: all 0.3s ease;
    }
    .user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 8px;
    }
    .ai {
      align-self: flex-start;
      background: rgba(42, 42, 74, 0.8);
      border: 1px solid #44446a;
      border-bottom-left-radius: 8px;
    }

    .input-area {
      padding: 22px 30px;
      background: rgba(17, 17, 24, 0.95);
      border-top: 1px solid #33334a;
    }
    .input-box {
      display: flex;
      align-items: center;
      background: #2a2a4a;
      border-radius: 9999px;
      padding: 10px;
      gap: 12px;
      transition: all 0.3s ease;
    }
    .input-box:focus-within {
      box-shadow: 0 0 0 4px rgba(123, 94, 255, 0.3);
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 16.5px;
      padding: 12px;
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <div class="login-box">
      <h1 style="margin-bottom: 10px;">Hacks Maker AI</h1>
      <p style="color:#aaa; margin-bottom: 30px;">Welcome back, Creator</p>
      
      <input type="text" id="username" value="Hacks Maker" placeholder="Username">
      <input type="password" id="password" placeholder="Password (optional)">
      
      <button class="login-btn" onclick="login()">Sign In</button>
      <button onclick="signup()" style="background:#3a3a5a;">Create New Account</button>
    </div>
  </div>

  <!-- Main App -->
  <div id="main-app" class="hidden" style="display: flex; width: 100%; height: 100%;">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo"><i class="fas fa-bolt"></i> Hacks Maker AI</div>
      <div class="new-chat" onclick="newChat()">+ New Conversation</div>
      
      <div style="margin-top: 20px; color: #777; font-size: 13px; padding: 0 10px;">Recent</div>
      <div id="history-list"></div>
    </div>

    <!-- Chat Area -->
    <div class="main">
      <header>
        <div><strong>Hacks Maker's Personal AI</strong></div>
        <div style="color:#888;">Unlimited • No Cooldown</div>
      </header>

      <div class="chat-area" id="chat"></div>

      <div class="input-area">
        <div class="input-box">
          <button onclick="document.getElementById('fileInput').click()" style="background:none; font-size:26px; color:#aaa;">📎</button>
          <input type="text" id="userInput" placeholder="Ask me anything..." 
                 onkeypress="if(event.key === 'Enter') sendMessage()">
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" style="display:none;" onchange="handleFile(this)">

  <script>
    let currentUser = "Hacks Maker";

    function login() {
      currentUser = document.getElementById("username").value || "Hacks Maker";
      document.getElementById("login-screen").style.opacity = "0";
      setTimeout(() => {
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("main-app").classList.remove("hidden");
        startChat();
      }, 600);
    }

    function signup() {
      alert("Account created successfully!\nWelcome, Hacks Maker!");
      login();
    }

    function addMessage(text, sender) {
      const chat = document.getElementById('chat');
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerHTML = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function handleFile(input) {
      if (input.files.length) {
        addMessage(`📎 Attached: <strong>${input.files[0].name}</strong>`, 'user');
      }
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      // Thinking
      const thinking = document.createElement('div');
      thinking.className = 'message ai';
      thinking.textContent = 'Thinking...';
      document.getElementById('chat').appendChild(thinking);

      await new Promise(r => setTimeout(r, 800));
      thinking.remove();

      let reply = "Got it. What else would you like to explore?";

      const lower = text.toLowerCase();

      // Better response logic
      if (lower.includes("hi") || lower.includes("hello")) {
        reply = `Hello ${currentUser}! How can I help you today?`;
      } 
      else if (lower.includes("how are you")) {
        reply = "I'm doing great, thanks for asking! Ready to assist you.";
      } 
      else if (lower.includes("who created") || lower.includes("your creator") || lower.includes("who made you")) {
        reply = `<strong>You did.</strong> You are Hacks Maker — my creator.`;
      } 
      else if (lower.includes("thank")) {
        reply = "You're welcome, Hacks Maker ❤️";
      }

      addMessage(reply, 'ai');
    }

    function newChat() {
      document.getElementById('chat').innerHTML = '';
      addMessage("New chat started.<br>How can I help you today?", 'ai');
    }

    function startChat() {
      document.getElementById('chat').innerHTML = '';
      addMessage(`Welcome back, <strong>${currentUser}</strong>!<br>I'm your personal unlimited AI assistant.<br>What would you like to create or discuss today?`, 'ai');
    }

    // Auto focus
    window.onload = () => {
      // You can remove this if you want to force login every time
      // login();
    };
  </script>
</body>
</html>
